<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Key Test</title>
    <style>
        body {
            display: flex;
            flex-direction: row; /* Align arrows horizontally */
            align-items: flex-start; /* Align items to the top */
            justify-content: flex-start; /* Align items to the left */
            width: 100vw;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            overflow: hidden; /* Prevent scrolling */
        }

        .arrow {
            width: 100px;
            height: 100px;
            margin: 20px; /* Space between arrows */
            background-size: cover;
            background-image: url('inactive.png'); /* Default inactive image */
            transition: filter 0.5s ease; /* Smooth transition when changing */
        }

        .down {
            transform: rotate(0deg);
        }

        .up {
            transform: rotate(180deg); /* Up arrow */
        }

        .left {
            transform: rotate(90deg); /* Left arrow */
        }

        .right {
            transform: rotate(270deg); /* Right arrow */
        }

        /* Animation for hue rotation */
        @keyframes rainbow {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        .active {
            animation: rainbow 1s linear infinite; /* Run the animation when active */
        }
    </style>
</head>
<body>
    <div class="arrow left"></div>
    <div class="arrow down"></div>
    <div class="arrow up"></div>
    <div class="arrow right"></div>

    <script>
        document.addEventListener('keydown', function(event) {
            switch(event.key) {
                case 'ArrowDown':
                    changeArrowImage('.down', true);
                    break;
                case 'ArrowRight':
                    changeArrowImage('.right', true);
                    break;
                case 'ArrowUp':
                    changeArrowImage('.up', true);
                    break;
                case 'ArrowLeft':
                    changeArrowImage('.left', true);
                    break;
                default:
                    break;
            }
        });

        document.addEventListener('keyup', function(event) {
            switch(event.key) {
                case 'ArrowDown':
                    changeArrowImage('.down', false);
                    break;
                case 'ArrowRight':
                    changeArrowImage('.right', false);
                    break;
                case 'ArrowUp':
                    changeArrowImage('.up', false);
                    break;
                case 'ArrowLeft':
                    changeArrowImage('.left', false);
                    break;
                default:
                    break;
            }
        });

        function changeArrowImage(selector, isActive) {
            const arrow = document.querySelector(selector);
            arrow.style.backgroundImage = isActive ? "url('active.png')" : "url('inactive.png')"; // Change image
            if (isActive) {
                arrow.classList.add('active'); // Add class for animation
            } else {
                arrow.classList.remove('active'); // Remove class to stop animation
            }
        }
    </script>
</body>
</html>
